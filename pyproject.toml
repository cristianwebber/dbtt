[project]
name = "dbtt"
version = "0.2.0"
description = "A batteries-included toolkit that layers workflow helpers on top of dbt-core."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cristian Webber" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "ruamel.yaml>=0.17",
    "sqlglot>=20",
    "sqlfluff>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "duckdb>=1",
]

[project.scripts]
dbtt = "dbtt.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dbtt.rules" = ["*.sqlfluff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
