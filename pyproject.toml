[project]
name = "dbtt"
version = "0.2.0"
description = "A batteries-included toolkit that layers workflow helpers on top of dbt-core."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cristian Webber" }]
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "ruamel.yaml>=0.18.6",
    "sqlglot>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "duckdb>=1.1.0",
]

[project.scripts]
dbtt = "dbtt.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
